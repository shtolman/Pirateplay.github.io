<script>
  // Telegram Mini App init (один раз)
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  function renderChoice(name, rent, rates, flow, чек) {
    const fixed = rent + rates;
    const out = document.getElementById('out');
    out.style.display = 'block';
    out.innerHTML = `
      <h3>✅ You chose: ${name}</h3>
      <div><b>Rent:</b> £${rent}/month</div>
      <div><b>Business rates (est.):</b> £${rates}/month</div>
      <div><b>Fixed costs:</b> £${fixed}/month</div>
      <div><b>Flow:</b> ${flow} cars/day</div>
      <div><b>Avg ticket:</b> £${чек}</div>
      <p class="muted">Day 1 complete. Day 2: break-even & budget.</p>
      <button onclick="finishDay1()">✅ Завершить День 1</button>
    `;
  }

  // Нажатие на локацию
  function pick(name, rent, rates, flow, чек) {
    localStorage.setItem("day1_location", JSON.stringify({ name, rent, rates, flow, чек }));
    renderChoice(name, rent, rates, flow, чек);
  }

  // Автовосстановление выбора (один раз при загрузке страницы)
  (function restore() {
    const saved = localStorage.getItem("day1_location");
    if (!saved) return;
    try {
      const s = JSON.parse(saved);
      renderChoice(s.name, s.rent, s.rates, s.flow, s.чек);
    } catch (e) {
      console.log("Bad saved data:", e);
    }
  })();

  // Завершение дня 1: отправка данных боту
  function finishDay1() {
    const payload = localStorage.getItem("day1_location") || "{}";
    tg?.sendData(payload); // бот получит web_app_data
    // можно закрыть мини-апп:
    tg?.close();
  }
</script>
